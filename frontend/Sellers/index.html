<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="leafpay-api-base-url" content="" />
  <title>LeafPay — Satıcı Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            leaf: {
              50: '#F1FAF6', 100: '#E1F5EE', 200: '#BFE7D6',
              300: '#8DD3B7', 400: '#4FB893', 500: '#1D9E75',
              600: '#168562', 700: '#0F6A4F', 800: '#085041', 900: '#053A30',
            },
            amber: { 400: '#F5B656', 500: '#EF9F27' },
            ink: '#2C2C2A', paper: '#F8F9F6',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./css/sellers-layout.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/badge-status.css">
  <link rel="stylesheet" href="./css/green-options.css">
  <link rel="stylesheet" href="./css/statistics.css">
  <link rel="stylesheet" href="./css/verification-test.css">
</head>
<body class="bg-paper text-ink">
  <div class="seller-panel">
    <aside id="sidebar"></aside>

    <main class="main-content">
      <header id="topbar"></header>
      <section id="dashboard-root"></section>
    </main>
  </div>

  <script src="../shared/env.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/green-options.js"></script>
  <script src="./js/badge-status.js"></script>
  <script src="./js/statistics.js"></script>
  <script src="./js/verification-test.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
